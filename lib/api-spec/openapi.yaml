openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SoulMatch AI - AI-powered matrimony platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User profile management
  - name: journey
    description: 30-day question journey
  - name: matches
    description: Match discovery and compatibility
  - name: interests
    description: Interest management
  - name: chat
    description: Real-time messaging (premium)
  - name: subscriptions
    description: Premium subscription plans
  - name: notifications
    description: User notifications
  - name: admin
    description: Admin panel operations
  - name: analytics
    description: Platform analytics
  - name: reports
    description: Trust & safety reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [auth]
      summary: Send email/phone OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/google:
    post:
      operationId: googleLogin
      tags: [auth]
      summary: Google OAuth login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── USERS ─────────────────────────────────────────────────────────────────

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/photos:
    post:
      operationId: uploadPhoto
      tags: [users]
      summary: Upload profile photo (Cloudinary URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadInput"
      responses:
        "200":
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/photos/{photoId}:
    delete:
      operationId: deletePhoto
      tags: [users]
      summary: Delete a profile photo
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Photo deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/me/preferences:
    get:
      operationId: getPreferences
      tags: [users]
      summary: Get match preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPreferences"
    put:
      operationId: updatePreferences
      tags: [users]
      summary: Update match preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchPreferencesInput"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPreferences"

  /users/{userId}:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a specific user's public profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"

  /users/me/stats:
    get:
      operationId: getMyStats
      tags: [users]
      summary: Get profile stats (profile views, match rate, etc.)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileStats"

  /users/me/verification:
    post:
      operationId: submitVerification
      tags: [users]
      summary: Submit identity verification documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "200":
          description: Verification submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── JOURNEY ───────────────────────────────────────────────────────────────

  /journey/questions:
    get:
      operationId: getJourneyQuestions
      tags: [journey]
      summary: Get all 30-day journey questions
      responses:
        "200":
          description: Questions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JourneyQuestion"

  /journey/progress:
    get:
      operationId: getJourneyProgress
      tags: [journey]
      summary: Get user's journey progress
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProgress"

  /journey/answers:
    post:
      operationId: submitAnswer
      tags: [journey]
      summary: Submit answer to a journey question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "201":
          description: Answer submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyAnswer"

  /journey/answers/{questionId}:
    put:
      operationId: updateAnswer
      tags: [journey]
      summary: Update an existing answer
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerUpdate"
      responses:
        "200":
          description: Answer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyAnswer"

  /journey/personality:
    get:
      operationId: getPersonalityProfile
      tags: [journey]
      summary: Get AI-generated personality profile
      responses:
        "200":
          description: Personality profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalityProfile"

  # ── MATCHES ───────────────────────────────────────────────────────────────

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: Get curated matches for the current user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Matches list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchesPage"

  /matches/{matchId}/compatibility:
    get:
      operationId: getCompatibility
      tags: [matches]
      summary: Get AI compatibility score with a user
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Compatibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityScore"

  /matches/daily:
    get:
      operationId: getDailyMatches
      tags: [matches]
      summary: Get today's curated matches (premium spotlight)
      responses:
        "200":
          description: Daily matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchCard"

  /matches/who-viewed-me:
    get:
      operationId: getProfileViewers
      tags: [matches]
      summary: Get users who viewed current user's profile (premium)
      responses:
        "200":
          description: Viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProfile"

  # ── INTERESTS ─────────────────────────────────────────────────────────────

  /interests:
    get:
      operationId: getInterests
      tags: [interests]
      summary: Get sent and received interests
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [sent, received, mutual]
      responses:
        "200":
          description: Interests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Interest"
    post:
      operationId: sendInterest
      tags: [interests]
      summary: Send interest to a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestInput"
      responses:
        "201":
          description: Interest sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interest"

  /interests/{interestId}:
    patch:
      operationId: respondToInterest
      tags: [interests]
      summary: Accept or decline an interest
      parameters:
        - name: interestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestResponse"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interest"
    delete:
      operationId: withdrawInterest
      tags: [interests]
      summary: Withdraw a sent interest
      parameters:
        - name: interestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /interests/summary:
    get:
      operationId: getInterestSummary
      tags: [interests]
      summary: Get interest counts and pending actions
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestSummary"

  # ── CHAT ──────────────────────────────────────────────────────────────────

  /chat/conversations:
    get:
      operationId: getConversations
      tags: [chat]
      summary: Get all conversations (premium)
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /chat/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [chat]
      summary: Get messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /chat/conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [chat]
      summary: Mark all messages in conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────

  /subscriptions/plans:
    get:
      operationId: getPlans
      tags: [subscriptions]
      summary: Get all subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [subscriptions]
      summary: Get current user's subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/checkout:
    post:
      operationId: createCheckout
      tags: [subscriptions]
      summary: Create Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /subscriptions/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel current subscription
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /subscriptions/rewards:
    get:
      operationId: getRewards
      tags: [subscriptions]
      summary: Get user rewards and coins balance
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsProfile"

  # ── NOTIFICATIONS ─────────────────────────────────────────────────────────

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get user notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsPage"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /notifications/count:
    get:
      operationId: getUnreadCount
      tags: [notifications]
      summary: Get unread notification count
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  # ── REPORTS ───────────────────────────────────────────────────────────────

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: Report a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /reports/block:
    post:
      operationId: blockUser
      tags: [reports]
      summary: Block a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /reports/blocked:
    get:
      operationId: getBlockedUsers
      tags: [reports]
      summary: Get list of blocked users
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProfile"

  # ── ADMIN ─────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: Get all users with filters
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"

  /admin/users/{userId}:
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get single user details
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user status/role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"

  /admin/reports:
    get:
      operationId: adminGetReports
      tags: [admin]
      summary: Get all user reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewed, resolved, dismissed]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportsPage"

  /admin/reports/{reportId}:
    patch:
      operationId: adminResolveReport
      tags: [admin]
      summary: Resolve or dismiss a report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolution"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/verifications:
    get:
      operationId: adminGetVerifications
      tags: [admin]
      summary: Get pending verification requests
      responses:
        "200":
          description: Verifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationRequest"

  /admin/verifications/{verificationId}:
    patch:
      operationId: adminProcessVerification
      tags: [admin]
      summary: Approve or reject a verification
      parameters:
        - name: verificationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDecision"
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── ANALYTICS ─────────────────────────────────────────────────────────────

  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Platform overview stats
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/users:
    get:
      operationId: getUserAnalytics
      tags: [analytics]
      summary: User growth and registration trends
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        "200":
          description: User analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAnalytics"

  /analytics/revenue:
    get:
      operationId: getRevenueAnalytics
      tags: [analytics]
      summary: Revenue and subscription trends
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        "200":
          description: Revenue analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueAnalytics"

  /analytics/matches:
    get:
      operationId: getMatchAnalytics
      tags: [analytics]
      summary: Match and engagement analytics
      responses:
        "200":
          description: Match analytics
          content:

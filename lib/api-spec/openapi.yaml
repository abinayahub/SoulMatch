        gender:
          type: string
          enum: [male, female, other]
        phone:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SendOtpInput:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [email, phone]
        value:
          type: string

    VerifyOtpInput:
      type: object
      required: [type, value, otp]
      properties:
        type:
          type: string
          enum: [email, phone]
        value:
          type: string
